name: Sync upstream

# Mantém o fork atualizado com ctresb/leis sem clonar o repo
# (300k+ commits — checkout completo é inviável no runner).
# O endpoint merge-upstream faz fast-forward quando o fork não
# divergiu; divergência vira warning no log, não quebra.

on:
  schedule:
    # ~4h30 BRT — o sync diário da API (4h) já pega o repo fresco
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream → main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/merge-upstream \
            -f branch=main \
            --jq '.message, .merge_type, .base_branch' \
          || echo "::warning::merge-upstream falhou — fork divergiu do upstream?"
